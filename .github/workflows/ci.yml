name: ci

# Three-OS unit-test matrix, run on every push / PR.
#
# Each job sets up its platform, then runs the shared (cross-platform,
# model-free) tier plus that platform's own tier:
#   Linux   -> tests/shared + tests/linux
#   Windows -> tests/shared + tests/windows
#   WSL     -> tests/shared + tests/wsl   (simulated: ubuntu + VT_PLATFORM=wsl)
#
# tests/e2e (real model / audio devices) is intentionally NOT run here. Run it
# locally with the model present:
#   ./test.sh e2e                 (Linux / WSL)
#   .\test.ps1 e2e                (Windows)
#   python tests/e2e/test_live_speaker_mic_loopback.py all   (needs a mic)
# See the README "Testing" section and docs/agent_testing_workflow.md.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests-linux:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Run shared + Linux tests
        run: nix develop --command python -m pytest tests/shared tests/linux -q

  unit-tests-windows:
    name: Unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy soundfile sounddevice pyyaml pyperclip pynput keyboard rich psutil

      - name: Run shared + Windows tests
        env:
          VT_PLATFORM: windows
          PYTHONPATH: src
        run: python -m pytest tests/shared tests/windows -v --tb=short

  unit-tests-wsl:
    name: Unit tests (WSL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Run shared + WSL tests
        env:
          VT_PLATFORM: wsl
          WSL_DISTRO_NAME: NixOS
        run: nix develop --command python -m pytest tests/shared tests/wsl -q
