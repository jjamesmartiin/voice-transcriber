name: release

# Builds and attaches release artifacts to a GitHub Release:
# - Linux: portable AppImage (vt-x86_64.AppImage)
# - Windows: standalone directory bundle zip (VoiceTranscriber-windows-x86_64.zip)
#            and a single-file installer (VoiceTranscriber-windows-x86_64-setup.exe)
# - any platform: REQUIREMENTS.txt, naming the bundles this build resolves
#
# A release carries the app runtime only: no model weights and no config. GitHub
# attaches the source archive (zip/tar.gz) to every tag itself, so CI does not
# build one. There is no macOS artifact yet — see docs/TODO.md.
#
# No secrets or tokens are used anywhere in this workflow. Model weights and the
# pinned llama-server are NOT fetched in CI: they live on separate bundle tags
# (model-cohere-<rev12>, tool-llama-server-<pin>), and the application installs
# them on first run or loads them from a local models/ directory.
# REQUIREMENTS.txt is generated here from the registries that the client itself
# reads, so it cannot drift from what a build actually fetches.
#
# Trigger: push a tag like v1.3.0 -> the AppImage, the Windows ZIP and
# REQUIREMENTS.txt are built and attached.
# Manual trigger: workflow_dispatch -> specify target tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to attach assets to (e.g. v1.3.0). Required: it is not inferred, or a manual run would attach an unreleased build to whatever tag was typed."
        required: true
        type: string
      build:
        description: "Build and attach both artifacts (false = neither)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  appimage:
    name: Build portable Linux AppImage + REQUIREMENTS.txt
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.build == 'true'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df # v23

      - name: Build and bundle the app into a single AppImage
        run: |
          nix bundle --bundler github:ralismark/nix-appimage/7946addbc0d97e358a6d7aefe5e82310f0fe6b18 \
            --extra-experimental-features "nix-command flakes" \
            ".#default"
          # Name the asset by architecture. Only x86_64-linux is built today
          # (see docs/TODO.md); the arch suffix lets a future aarch64 job attach to
          # the same release without colliding.
          appimage="$(ls -1 *.AppImage | head -n1)"
          mv "$appimage" vt-x86_64.AppImage
          ls -lh vt-x86_64.AppImage

      # The bundles a build resolves live in two code paths, not in this
      # workflow, so the manifest is generated from them rather than restated.
      - name: Generate REQUIREMENTS.txt (the bundles this build resolves)
        run: |
          python3 scripts/write_release_requirements.py \
            --tag "${{ github.event.inputs.tag_name || github.ref_name }}" \
            --out REQUIREMENTS.txt
          cat REQUIREMENTS.txt

      - name: Upload AppImage and REQUIREMENTS.txt to release
        uses: softprops/action-gh-release@b5a645e6d7f681d09866ab86ba7918b222989555 # v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            ./vt-*.AppImage
            ./REQUIREMENTS.txt
          fail_on_unmatched_files: true

  windows-exe:
    name: Build standalone Windows EXE
    runs-on: windows-latest
    # Same gate as the AppImage job: without it, `build: false` still built and
    # attached a Windows bundle to the release.
    if: github.event_name == 'push' || github.event.inputs.build == 'true'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4

      - name: Set up Python
        uses: actions/setup-python@ff73b2463e2f3baa703f830da214b8dfeeaeccf8 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r platforms/windows/requirements.txt
          pip install -r platforms/windows/requirements-dev.txt

      - name: Build standalone Windows bundle
        run: |
          python platforms/windows/build_offline.py --no-model

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VoiceTranscriber -DestinationPath VoiceTranscriber-windows-x86_64.zip
          Get-Item VoiceTranscriber-windows-x86_64.zip | Select-Object Name, Length

      # One .exe to download instead of a zip to extract by hand. Inno Setup is
      # preinstalled on this image; ISCC.exe is not always on PATH, hence the
      # explicit fallback, and a hard failure rather than a release with no
      # installer. See platforms/windows/installer.iss for why this is an
      # installer and not `PyInstaller --onefile`.
      - name: Build single-file installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (python -c 'import sys; sys.path.insert(0, "src"); import voice_transcriber; print(voice_transcriber.__version__)').Trim()
          Write-Host "App version: $version"
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe (Inno Setup 6.3+) not found on this runner" }
          & $iscc "/DAppVersion=$version" 'platforms\windows\installer.iss'
          Get-Item dist/installer/*-setup.exe | Select-Object Name, Length

      - name: Upload Windows assets to release
        uses: softprops/action-gh-release@b5a645e6d7f681d09866ab86ba7918b222989555 # v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            ./VoiceTranscriber-windows-x86_64.zip
            ./dist/installer/*-setup.exe
          fail_on_unmatched_files: true
