name: release

# Builds and attaches the portable Linux AppImage to a GitHub Release.
#
# No secrets or tokens are used anywhere in this workflow. The Cohere model
# weights are NOT fetched in CI: they are Apache-2.0 and are mirrored by the
# maintainer from the local HF cache into the same release (see
# scripts/prepare_model_release.py and dist/model/), so end users install the
# app and its model without any Hugging Face account.
#
# Trigger: push a tag like v1.0.2  ->  AppImage is built and attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    name: Build portable Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Build and bundle the app into a single AppImage
        run: |
          nix bundle --bundler github:ralismark/nix-appimage \
            --extra-experimental-features "nix-command flakes" \
            ".#default"
          # Name the asset by architecture. Only x86_64-linux is built today
          # (see TODO.md); the arch suffix lets a future aarch64 job attach to
          # the same release without colliding.
          appimage="$(ls -1 *.AppImage | head -n1)"
          mv "$appimage" vt-x86_64.AppImage
          ls -lh vt-x86_64.AppImage

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          files: ./vt-*.AppImage
          fail_on_unmatched_files: true
