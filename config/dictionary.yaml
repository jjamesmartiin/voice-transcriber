# Voice Transcriber — Custom Word & Technical Phrase Dictionary
# Automatically compiled into a ~0.005 ms high-speed Trie regex in post_processor.py.
# Matches case-insensitively and replaces with exact target casing/formatting.

dictionary:
  # AI / Models
  deepseq: Deepseek
  deep seq: Deepseek
  deep seek: Deepseek

  # Nix / NixOS
  nixos: NixOS
