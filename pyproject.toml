[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-transcriber"
version = "1.3.0"
description = "Real-time voice dictation with streaming VAD, Cohere ASR backend, and English post-processor"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "James Martin"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "accelerate",
    "datasets",
    "huggingface-hub",
    "librosa",
    "numpy",
    "protobuf",
    "psutil",
    "pyyaml",
    "rich",
    "scipy",
    "sentencepiece",
    "sounddevice",
    "soundfile",
    "torch",
    "transformers",
    "evdev; sys_platform == 'linux'",
    "python-uinput; sys_platform == 'linux'",
    "pyperclip; sys_platform != 'linux'",
    "pynput; sys_platform != 'linux'",
    "keyboard; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "pytest-mock",
    "ruff",
    "pyinstaller",
]
gui = [
    "gtts",
    "tkinter",
]

[project.scripts]
vt = "voice_transcriber.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["voice_transcriber*"]

# ---------------------------------------------------------------------------
# Linting
# ---------------------------------------------------------------------------
# This gate is about correctness, not cosmetics: it catches undefined and
# unused names, bare excepts and the bugbear footguns. It is deliberately
# narrow, because the alternative — turning on every rule and rewriting the
# tree — buries real fixes in noise.
#
# `ruff format` is NOT enforced. It would rewrite most of this codebase (the
# long lines here are mostly hand-aligned tables and message strings), which is
# a large, risky diff that has nothing to do with behaviour. Run it on a file
# you are already rewriting if you like; CI will not ask you to.
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "models", "result", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# The root compatibility shims put src/ on sys.path before importing the real
# module, and re-export it wholesale.
"src/*.py" = ["E402"]
# Tests put src/ on sys.path before importing the app (conftest.py does it for
# the tiers that need it, and a few tests do it themselves).
"tests/**" = ["E402"]
# Module-level `__getattr__` resolves these lazily through the HAL; ruff cannot
# see that they exist.
"src/voice_transcriber/hotkeys.py" = ["F822"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
# Keep the cache inside tests/ so the repo root stays flat. (Was pytest.ini.)
[tool.pytest.ini_options]
cache_dir = "tests/.pytest_cache"
